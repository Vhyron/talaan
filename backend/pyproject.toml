[project]
name = "talaan-backend"
version = "0.1.0"
description = "Talaan backend: local AI for sensitive client files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic>=2.14.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
